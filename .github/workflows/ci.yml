name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SHADOWTRACE_SECRET_KEY: ci-only-not-a-production-secret
      SHADOWTRACE_THREAT_INTEL_MODE: offline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --requirement requirements-dev.txt
      - name: Test
        run: python -m pytest -q
      - name: Compile
        run: python -m compileall -q dashboard parsers scripts correlation-engine tests
      - name: Audit dependencies
        run: python -m pip_audit --requirement requirements.txt
